target: models.transformer.basemodel.TrainModel
params:
  ckpath: /work3/s212645/Spectral_Reconstruction/checkpoint/MST_Plus_Plus/
  image_key: 'label'
  cond_key: 'cond'
  # cond_key: 'ycrcb'
  valid_ratio: 0.053
  test_ratio: 0.0
  datanames: ['ARAD-origin/']
  random_split_data: False
  stride: 128
  padding_size: 128
  total_iter: 400000
  progressive_train: False
  val_in_epoch: True
  
  genconfig:
    target: models.transformer.MST_Plus_Plus
    params:
      in_channels: 3
      out_channels: 31
      n_feat: 31
      stage: 3

  data:
    target: dataset.base.DataModuleFromConfig
    params:
      batch_size: 40
      num_workers: 32
      train:
        target: dataset.datasets.TrainDataset
        params:
          data_root: /work3/s212645/Spectral_Reconstruction/
          crop_size: 128
          valid_ratio: 0.053
          test_ratio: 0.0
          random_split: False
          arg: True
          stride: 8
          datanames: ['ARAD-origin/']
      validation:
        target: dataset.datasets.ValidDataset
        params:
          data_root: /work3/s212645/Spectral_Reconstruction/
          crop_size: 512
          valid_ratio: 0.053
          test_ratio: 0.0
          random_split: False
          arg: False
          datanames: ['ARAD-origin/']
